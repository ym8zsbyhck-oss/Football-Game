<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07140d"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"><title>Russian Football Career 2026 v1.1.3</title></head><body>
<div id="rotate"><div><div style="font-size:58px">📱↻</div><h2>Поверните iPhone горизонтально</h2></div></div>
<section id="select" class="screen active bg"><div class="top"><div class="brand">RUSSIAN FOOTBALL CAREER 2026 • v1.1.3</div><button id="continueCareer" class="secondary" style="display:none">Продолжить карьеру</button></div><div class="selectBody"><aside class="panel side"><button class="league active" data-league="rpl">РПЛ</button><button class="league" data-league="fnl1">Первая лига</button><button class="league" data-league="fnl2">Вторая лига А</button><div class="card"><b>Данные</b><p>Состав дивизионов: август 2026. Эмблемы загружаются через интернет.</p></div></aside><main class="panel clubPane"><div id="clubGrid" class="clubs"></div><div class="pick"><img id="selectedLogo"><div style="flex:1"><b id="selectedName">Выберите клуб</b></div><button id="startCareer" class="primary" disabled>НАЧАТЬ</button></div></main></div></section>
<section id="career" class="screen bg"><div class="top"><div class="brand">КАРЬЕРА</div><div style="display:flex;gap:8px"><button id="saveCareerBtn" class="secondary">Сохранить</button><button id="back" class="secondary">Меню</button></div></div><div class="careerBody"><aside class="panel side"><div class="clubHead"><img id="careerLogo"><div><b id="careerName"></b><small id="careerLeague" style="display:block;color:#9fb3a6"></small></div></div><button class="nav active" data-tab="overview">Обзор</button><button class="nav" data-tab="table">Таблица</button><button class="nav" data-tab="calendar">Календарь</button><button class="nav" data-tab="tournaments">Турниры</button><button class="nav" data-tab="rules">Регламент</button></aside><main id="content" class="panel content"></main></div></section>
<section id="game" class="screen"><canvas id="pitch"></canvas><button id="pause" class="pause">Ⅱ</button><div class="hud"><img id="hLogo"><b id="hName"></b><div><div id="competitionLabel" class="competitionLabel">РПЛ</div><div id="score" class="score">0 : 0</div><div id="clock" class="clock">00:00</div></div><b id="aName"></b><img id="aLogo"></div><div class="broadcastBug" aria-label="Матч ТВ — прямой эфир"><img src="matchtv.png" alt="МАТЧ!"><div class="liveLine"><i></i><span>ПРЯМОЙ ЭФИР</span></div></div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="through" class="act through">ВРАЗРЕЗ</button><button id="shoot" class="act shoot">УДАР</button><button id="pass" class="act pass">ПАС</button><button id="sprint" class="act sprint">РЫВОК</button><button id="switch" class="act switch">СМЕНА</button></div><div id="playerInfo" class="playerInfo leftInfo"></div><div id="gkInfo" class="playerInfo rightInfo"></div><div id="halftime" class="overlay halftimeOverlay"><div class="modal halftimeCard">
      <div class="halfTop">
        <small>ПЕРЕРЫВ</small>
        <h2 id="halfScore">0 : 0</h2>
        <span id="halfAdded"></span>
      </div>
      <div id="halfStats" class="halfStats"></div>
      <div class="halfEvents">
        <div class="halfEventsHead"><h3>События первого тайма</h3><small>Прокрутите, если событий много</small></div>
        <div id="halfEvents" class="halfEventsList"></div>
      </div>
      <div class="halfContinue">
        <button id="secondHalfBtn" class="primary">ПРОДОЛЖИТЬ ВТОРОЙ ТАЙМ</button>
      </div>
    </div></div><div id="pauseOverlay" class="overlay"><div class="modal"><h2>Пауза</h2><div class="row"><button id="resume" class="primary">Продолжить</button></div></div></div><div id="result" class="overlay"><div class="modal"><h2>Матч окончен</h2><p id="resultText"></p><div class="row"><button id="continue" class="primary">Продолжить карьеру</button></div></div></div></section>
<script src="data.js"></script><script src="logos.js"></script><script src="career.js"></script><script src="match.js"></script><script src="app.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script></body></html>
